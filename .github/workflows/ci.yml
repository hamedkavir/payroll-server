name: CI

on:
  push:
    branches: [main]
    paths:
      - "payroll-server/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "payroll-server/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: payroll-server/server/package-lock.json

      - name: Install dependencies
        working-directory: payroll-server/server
        run: npm ci

      - name: Run automated tests
        working-directory: payroll-server/server
        run: npm test

      - name: Check JavaScript syntax
        working-directory: payroll-server
        shell: bash
        run: |
          find server client/js tests -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check
